name: Capture NHL shots props

on:
  schedule:
    # Weekdays and weekends at 3:37 PM EDT (2:37 PM EST) for evening games.
    - cron: '37 19 * * *'
    # Extra weekend run at 12:37 PM EDT for afternoon games.
    - cron: '37 16 * * 0,6'
  workflow_dispatch:
    inputs:
      label:
        description: 'Snapshot label (open or close)'
        default: 'open'
      from_hours:
        description: 'Only games starting at least this many hours from now'
        default: '0'
      to_hours:
        description: 'Only games starting within this many hours'
        default: '8'

permissions:
  contents: write

concurrency:
  group: repo-data-writes
  cancel-in-progress: false

jobs:
  capture-shots-props:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture shots-on-goal lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LABEL: ${{ github.event.inputs.label || 'open' }}
          FROM_HOURS: ${{ github.event.inputs.from_hours || '0' }}
          TO_HOURS: ${{ github.event.inputs.to_hours || '8' }}
        run: python scripts/capture_shots_odds.py --label "$LABEL" --from-hours "$FROM_HOURS" --to-hours "$TO_HOURS"
      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p data_files/props
          git add data_files/props/
          if git diff --staged --quiet; then
            echo "No new prop lines to commit"
            exit 0
          fi
          git commit -m "Auto-update shots prop snapshots [skip ci]"
          git pull --rebase origin main
          git push
