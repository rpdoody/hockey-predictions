name: Weekly Model Retraining

on:
  schedule:
    # Run weekly on Sundays at 8 AM UTC (3 AM ET)
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain ML model
        run: python retrain_model.py

      - name: Commit and push updated model
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ ! -d "data_files/models" ]; then
            echo "Models directory not found"
            exit 1
          fi

          git add data_files/models/
          if git diff --staged --quiet; then
            echo "No model changes to commit"
            exit 0
          fi

          git commit -m "Weekly model retraining [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Model updated and committed"
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1
