name: Capture NHL Odds

on:
  schedule:
    - cron: '0 1,7,12,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-writes
  cancel-in-progress: false

jobs:
  capture-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture odds snapshots
        run: python auto_capture_odds.py
      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p data_files/odds
          git add data_files/odds/
          if git diff --staged --quiet; then
            echo "No new odds files to commit"
            exit 0
          fi
          git commit -m "Auto-update odds snapshots [skip ci]"
          git pull --rebase origin main
          git push
