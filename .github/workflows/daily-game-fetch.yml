name: Daily Game Schedule Fetch

on:
  schedule:
    # Run daily at 7 AM UTC (3 AM ET)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-writes
  cancel-in-progress: false

jobs:
  fetch-schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch game schedules
        run: python auto_fetch_games.py --days 10

      - name: Commit schedule cache updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Force add since the cache is ignored; tolerate no matching files
          git add -f data_files/cache/api-web.nhle.com_v1_schedule_*.json || true
          if git diff --staged --quiet; then
            echo "No schedule changes to commit"
            exit 0
          fi
          GAME_COUNT=$(git diff --staged --numstat | wc -l)
          git commit -m "chore: update game schedules (${GAME_COUNT} files updated)"
          git pull --rebase --autostash origin main
          git push
          echo "Committed ${GAME_COUNT} schedule updates"

      - name: Generate NHL recommendations
        run: python scripts/generate_recommendations.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Export best bets for Sports Picks Grid
        run: python scripts/export_best_bets.py
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit best_bets_today.json and the pick log
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_files/best_bets_today.json || true
          git add data_files/pick_log || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: update best_bets_today and pick log [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1
